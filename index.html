  const initCoopRealtime = (roomCode) => {
   if(!sb) return;
   if(coChanRef.current) coChanRef.current.unsubscribe();
   const chan = sb.channel('coop_' + roomCode, { config: { presence: { key: myPid } } });
   coChanRef.current = chan;

   chan.on('presence', { event: 'sync' }, () => {
    const state = chan.presenceState();
    const remoteHumans = [];
    Object.entries(state).forEach(([k, list]) => {
     if(list && list[0]) remoteHumans.push(list[0]);
    });
    setCo(c => {
     // Keep current bots, replace human players with live presence
     const bots = c.players.filter(p => botOf(p.id));
     const humans = remoteHumans.map(h => ({
      id: h.id === myPid ? 'me' : h.id,
      name: h.name,
      ready: !!h.ready
     }));
     // Ensure 'me' is always present
     if(!humans.some(p => p.id === 'me')){
      humans.unshift({ id: 'me', name: me, ready: true });
     }
     const newPlayers = [...humans, ...bots];
     // Auto-destroy room if no real humans remain
     if(humans.length === 0){
      return { ...initCo(), code: 'ANGR-' + (1000 + Math.random() * 9000 | 0) };
     }
     // Keep host valid
     const hasHost = newPlayers.some(p => p.id === c.hostId);
     const newHost = hasHost ? c.hostId : 'me';
     return { ...c, players: newPlayers, hostId: newHost };
    });
   });

   chan.on('broadcast', { event: 'coop_msg' }, ({ payload }) => {
    if(!payload) return;
    if(payload.type === 'start'){
     setCo(c => ({ ...c, g: payload.g, players: c.players.map(p => ({ ...p, ready: true })) }));
    } else if(payload.type === 'cfg'){
     setCo(c => ({ ...c, cfg: payload.cfg }));
    } else if(payload.type === 'solve'){
     setCo(c => coSolve(c, payload.id === myPid ? 'me' : payload.id, 0, cwr.current));
    } else if(payload.type === 'crown'){
     setCo(c => ({ ...c, hostId: payload.targetId === myPid ? 'me' : payload.targetId }));

     toast('Вас виключено з кімнати');
     setCo(initCo());
    }
   });

    if(status === 'SUBSCRIBED'){
     await chan.track({ id: myPid, name: me, ready: true, isHost: iHost });
    }
   });
  };

     <div className='flex flex-wrap items-center gap-2'><span className='text-xs opacity-70 w-28'>Таймер раунду</span>{[[true,'Увімк'],[false,'Вимк']].map(([k,l])=><button key={l} className={sel(tw.timer===k)+' !py-1 text-sm'} onClick={()=>setTw(x=>({...x,timer:k}))}>{l}</button>)}</div>
     {tw.timer&&<div className='flex flex-wrap items-center gap-2'><span className='text-xs opacity-70 w-28'>Тривалість раунду</span>{[30,45,60,90].map(d=><button key={d} className={sel(tw.dur===d)+' !py-1 text-sm'} onClick={()=>setDur(d)}>{d}с</button>)}</div>}
     <div className='flex flex-wrap items-center gap-2'><span className='text-xs opacity-70 w-28'>Пауза між раундами</span>{[3,5,10].map(d=><button key={d} className={sel(tw.rest===d)+' !py-1 text-sm'} onClick={()=>setTw(x=>({...x,rest:d}))}>{d}с</button>)}</div>
     <div className='flex flex-wrap items-center gap-2'><span className='text-xs opacity-70 w-28'>Словник стріму</span>{[['easy','Легкий'],['mid','Середній'],['hard','Складний'],['mix','Змішаний'],['mine','Мій пак']].map(([k,l])=><button key={k} className={sel(tw.dict===k)+' !py-1 text-sm'} onClick={()=>k==='mine'?openPack('tw'):setTw(x=>({...x,dict:k}))}>{k==='mine'&&packName?'Мій пак: '+packName:l}</button>)}</div>
     <div className='flex flex-wrap items-center gap-2'><span className='text-xs opacity-70 w-28'>Таблиця лідерів</span>{[3,5,10].map(k=><button key={k} className={sel(top===k)+' !py-1 text-sm'} onClick={()=>setTop(k)}>Топ-{k}</button>)}</div>
     <div className='flex flex-wrap gap-2'>
      <button className={btn} onClick={()=>setAsk({msg:'Очистити топ очок? Усі очки гравців буде видалено.',fn:twClr})}><Ic n='trash'/> Очистити топ очок</button>
      <button className={btn} onClick={()=>setAsk({msg:'Скинути рекорд серії?',fn:twBest})}><Ic n='trash'/> Скинути рекорд серії</button>
      <button className={btn} onClick={()=>setAsk({msg:'Скинути гру? Лічильник раундів почнеться з 1.',fn:twGame})}><Ic n='trash'/> Скинути гру</button>
     </div>
    </div>
   </div>
   <div className={'max-w-[900px] mx-auto w-full '+(th.wrap||'')} style={th.wrapS}><div className={'tw-frame relative p-5 space-y-4 w-full text-white '+th.body+' '+th.font} style={th.bodyS}>
    
    <div className='flex flex-wrap items-start justify-between gap-3'>
     <div className='flex items-center gap-2'><span className={th.logo}>АНАГРАМА</span><span className={th.chip}>Раунд {tw.r}</span></div>
     <div className={th.chip+' flex items-center gap-2'}><span className='animate-pulse'><Fl c='w-5 h-5'/></span><span className='text-[10px] uppercase opacity-70'>Найкраща серія</span><b>{tw.best.n>=2?tw.best.name+' ×'+tw.best.n:'—'}</b></div>
    </div>
    <div className='text-center space-y-3'>
     <div className={'text-lg font-extrabold '+th.acc}>{tw.ph==='play'?'Розгадай слово!':tw.ok?'Слово відгадано!':tw.sk?'Слово пропущено':'Час вийшов!'}</div>
     <div className='relative'>{tw.paused&&<div className='absolute inset-0 z-10 flex items-center justify-center text-white/90'><span className='scale-[2]'><Ic n='lock'/></span></div>}<div className={'flex flex-nowrap justify-center items-center overflow-hidden px-4 py-6 gap-1.5'+(tw.paused?' blur-md opacity-30 select-none':'')}>{[...(tw.ph==='play'?tw.s:tw.w)].map((c,i)=>{const n=tw.w.length,rv=tw.ph==='rev';return <span key={i} className={'shrink min-w-[1.25rem] flex items-center justify-center uppercase select-none '+(n<=7?'w-16 h-16 text-3xl':n<=10?'w-14 h-14 text-3xl':'w-12 h-12 text-2xl')+' '+(rv?(tw.ok?th.win:th.lose)+' font-black shadow-lg '+(theme==='mint'?'rounded-none':'rounded-lg'):th.tile)} style={rv?{animation:(tw.ok?'winHop .7s ease ':'loseWobble .6s ease ')+(i*70)+'ms both'}:{...ts,animation:'floatWave 3.5s ease-in-out infinite'+(th.tileAnim||''),animationDelay:i*120+'ms'}}>{c}</span>})}</div></div>
     <div className='flex flex-wrap justify-center items-center gap-2'>{tw.ph==='play'?<><span className={th.chip}>Пиши слово в чат</span><span className={th.chip}>{tw.w.length} літер</span>{tw.timer&&<span className={th.chip+' flex items-center gap-1 '+(tw.t<=10?th.warn+' animate-pulse':th.acc)}><Ic n='timer'/> {Math.floor(tw.t/60)}:{String(tw.t%60).padStart(2,'0')}</span>}</>:<><span className={'px-3 py-1 rounded-full text-sm font-bold text-white '+(tw.ok?th.okBg:th.noBg)}>{tw.ok?'[ '+tw.winner+' вгадує! +1 ]':tw.sk?'[ Слово пропущено ]':'[ Ніхто не вгадав ]'}</span><span className={th.chip}>Нове слово через {tw.t}...</span></>}</div>
    </div>
    <div className='rounded-xl bg-black/25 p-4'>
     <div className='font-extrabold mb-2'>Таблиця лідерів <span className='text-xs font-normal opacity-60'>Топ {top}</span></div>
     {lst.length?<div className={'grid gap-2 '+(top>5?'sm:grid-cols-2':'')} style={top>5?{gridAutoFlow:'column',gridTemplateRows:'repeat(5,auto)'}:{}}>{lst.map((r,i)=>{const win=tw.ph==='rev'&&tw.ok&&r.name===tw.winner,t1=i===0&&theme==='neon';return <div key={r.name} className={'flex items-center gap-3 px-3 py-2 '+(win?th.okRow+' rounded-full':th.row+(i<3?' '+th.pod[i]:''))} style={t1&&!win?{background:'linear-gradient(90deg,rgba(250,204,21,.28),rgba(145,70,255,.38))'}:undefined}><span className={'w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-sm font-black '+(i<3?th.med[i]:th.rk)}>{i+1}</span><span className='flex-1 truncate font-semibold'>{r.name}</span>{r.streak>=2&&<span className='px-2 rounded-full bg-amber-400 text-slate-900 text-xs font-bold inline-flex items-center gap-0.5'><Fl c='w-3 h-3'/>{r.streak}</span>}<b className='tabular-nums text-lg'>{r.score}</b></div>})}</div>:<div className='text-sm opacity-60'>Поки порожньо: чекаємо першу відгадку в чаті</div>}
    </div>
   </div></div>
      <div className='tw-ctl flex flex-wrap justify-center gap-2'>
    <button className={btn} onClick={()=>twWin('father_267')}><Ic n='flask'/> Симулювати перемогу</button>
    <button className={btn} onClick={twFail}><Ic n='flask'/> Симулювати таймаут</button>
    <button className={btn} onClick={()=>setSim(!sim)}><Ic n='users'/> Симуляція чату: {sim?'увімк.':'вимк.'}</button>
   </div>
   <div className={card+' tw-ctl space-y-3 text-sm'}>
    <div className='flex flex-wrap items-center justify-between gap-2'><h2 className='font-bold'>Підключення до OBS</h2><span className='px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 text-xs font-semibold'>Рекомендована роздільна здатність: 900 × 560 px</span></div>
    <input readOnly value={wurl} onFocus={e=>e.target.select()} className={inp+' font-mono text-xs'}/>
    <div className='flex flex-wrap gap-2'>
     <button className={pri+' flex items-center gap-2'} onClick={()=>{try{navigator.clipboard.writeText(wurl)}catch(e){}setCopied(true);setTimeout(()=>setCopied(false),1800)}}><Ic n='copy'/> {copied?'Скопійовано!':'Скопіювати посилання для OBS'}</button>
     <a className={btn+' flex items-center gap-2'} href={wurl} target='_blank' rel='noopener'><Ic n='ext'/> Відкрити віджет у новій вкладці</a>
    </div>
    <ol className='list-decimal pl-5 space-y-1'>
     <li>В OBS додай джерело: «Браузер» (Browser Source).</li>
     <li>Встав скопійований URL у поле адреси.</li>
     <li>Вкажи ширину 900 і висоту 560. Готово!</li>
    </ol>
    <p className='text-xs opacity-60'>Посилання з цього вікна (claude.ai) вимагає входу, тому OBS його не відкриє: розмістіть гру на публічному хостингу, наприклад GitHub Pages. Віджет читає чат лише з розміщеної сторінки. Таблиця зберігається в браузері OBS, а власні набори слів туди не переходять.</p>
   </div>
  </section>}
  <footer className='mt-auto pt-6 border-t border-slate-200 dark:border-slate-700 flex flex-wrap gap-x-20 gap-y-6 text-sm'>
   <div className='flex flex-col items-start gap-2.5'><div className='text-xs uppercase tracking-wider opacity-50'>Про проєкт</div>
    <button className='text-left opacity-70 hover:opacity-100 hover:underline underline-offset-4 flex items-center gap-2 transition-opacity' onClick={()=>setModal('rules')}><Ic n='book'/> Про гру та правила</button>
    <button className='text-left opacity-70 hover:opacity-100 hover:underline underline-offset-4 flex items-center gap-2 transition-opacity' onClick={()=>setModal('idea')}><Ic n='bulb'/> Відгук \ Ідея \ Баг ?</button></div>
   <div className='flex flex-col items-start gap-2.5'><div className='text-xs uppercase tracking-wider opacity-50'>Підтримати проєкт</div>
    <a className='text-left opacity-70 hover:opacity-100 hover:underline underline-offset-4 flex items-center gap-2 transition-opacity !opacity-100 text-emerald-600 dark:text-emerald-400' href={MONO} target='_blank' rel='noopener'><Ic n='heart'/> Monobank</a>
    <a className='text-left opacity-70 hover:opacity-100 hover:underline underline-offset-4 flex items-center gap-2 transition-opacity' href={BMC} target='_blank' rel='noopener'><Ic n='coffee'/> Buy Me a Coffee</a></div>
   <div className='w-full text-xs opacity-40'>Created by Kazariel · © 2026 Анаграма · українська гра зі слів</div>
  </footer>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
